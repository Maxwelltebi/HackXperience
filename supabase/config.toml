# Local Supabase stack for development and CI (`pnpm db:start`).
# Production settings live in the Supabase dashboard, not here.
project_id = "hackxperience"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Local email catcher (was [inbucket] before Supabase CLI 3). Off: sign-in is OAuth only, so
# Supabase Auth never sends email, and our own email goes through SES. On CI runners its
# port 54324 also clashed with another listener ("address already in use").
[local_smtp]
enabled = false
port = 54324

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = [
  "http://127.0.0.1:3000/auth/callback",
  "http://localhost:3000/auth/callback",
  "hackxperience://auth/callback",
]
jwt_expiry = 3600
enable_signup = true

# Sign-in is Google or GitHub only. No email or password accounts.
[auth.email]
enabled = false

# To try OAuth locally: create OAuth apps whose callback is
# http://127.0.0.1:54321/auth/v1/callback, export the variables below,
# set enabled = true, and restart with `pnpm db:stop && pnpm db:start`.
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
skip_nonce_check = true

[auth.external.github]
enabled = false
client_id = "env(SUPABASE_AUTH_GITHUB_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GITHUB_SECRET)"
